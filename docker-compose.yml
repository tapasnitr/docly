version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docly_postgres
    environment:
      POSTGRES_USER: docly
      POSTGRES_PASSWORD: docly_password
      POSTGRES_DB: docly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docly"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docly_network

  redis:
    image: redis:7-alpine
    container_name: docly_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docly_network

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: docly_api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://docly:docly_password@postgres:5432/docly_db?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_HOST: 0.0.0.0
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    networks:
      - docly_network

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: docly_web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages:/app/packages
    networks:
      - docly_network

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: docly_worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://docly:docly_password@postgres:5432/docly_db?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - ./packages:/app/packages
    networks:
      - docly_network

  nginx:
    image: nginx:alpine
    container_name: docly_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - docly_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  docly_network:
    driver: bridge
